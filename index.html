<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Barbearia Inteligente</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root { 
            --bg-top: #111; 
            --amarelo: #FFC72C; 
            --verde-promo: #2ecc71; 
            --rotacao: -90deg; 
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            overflow: hidden;
            font-family: 'Kanit', sans-serif;
        }

        #app {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vh;
            height: 100vw;
            transform: translate(-50%, -50%) rotate(var(--rotacao));
            transform-origin: center center;
            display: flex;
            flex-direction: column;
            transition: opacity 0.5s ease;
        }

        .top-section { 
            flex: 0 0 25%; 
            background-color: var(--bg-top); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border-bottom: 5px solid #333; 
            transition: flex 0.5s ease, opacity 0.5s ease; 
            position: relative; 
            overflow: hidden; 
        }

        .top-section.escondido { 
            flex: 0 0 0%; 
            border: 0; 
            opacity: 0; 
            pointer-events: none;
        }

        .top-section.ocioso { 
            background-color: var(--verde-promo); 
            animation: pulseBg 2s infinite; 
        }

        .top-section.ocioso .counter-number, 
        .top-section.ocioso .icon-cut,
        .top-section.ocioso .counter-label { 
            display: none; 
        }

        .ocioso-msg { 
            display: none; 
            font-size: 3.5rem; 
            color: #000; 
            font-weight: 900; 
            text-align: center; 
            line-height: 1.1; 
            text-transform: uppercase; 
        }

        .top-section.ocioso .ocioso-msg { 
            display: block; 
        }

        @keyframes pulseBg { 
            0% { opacity: 1; } 
            50% { opacity: 0.8; } 
            100% { opacity: 1; } 
        }

        .info-container { 
            text-align: center; 
            display: flex; 
            align-items: center; 
            gap: 40px; 
        }

        .icon-cut { 
            font-size: 6rem; 
            color: #555; 
        }

        .text-group { 
            display: flex; 
            flex-direction: column; 
            align-items: flex-start; 
        }

        .counter-number { 
            font-size: 10rem; 
            font-weight: 900; 
            color: var(--amarelo); 
            line-height: 0.8; 
        }

        .counter-label { 
            font-size: 2rem; 
            color: #fff; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            margin-top: 10px; 
        }

        .bottom-section { 
            flex: 1; 
            position: relative; 
            background: #000; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }

        #player-video { 
            width: 100%; 
            height: 100%; 
            display: block; 
            object-fit: cover; 
        }

        .clock { 
            position: absolute; 
            bottom: 30px; 
            right: 30px; 
            background: rgba(0,0,0,0.6); 
            color: white; 
            padding: 10px 20px; 
            border-radius: 10px; 
            font-size: 1.5rem; 
            font-weight: bold; 
            z-index: 50; 
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            background-color: #2ecc71;
            border-radius: 50%;
            display: inline-block;
        }
        .status-dot.offline {
            background-color: #e74c3c;
        }

        #ad-layer { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: black; 
            z-index: 100; 
            opacity: 0; 
            pointer-events: none; 
            transition: opacity 0.5s ease; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }

        #ad-layer.active { 
            opacity: 1; 
            pointer-events: all; 
        }

        .ad-content { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            display: none; 
        }

        .ad-content.show { 
            display: block; 
        }

        .tag-inteligente { 
            position: absolute; 
            top: 20px; 
            right: 20px; 
            background: #FFC72C; 
            color: black; 
            padding: 10px 20px; 
            font-weight: bold; 
            font-size: 1.5rem; 
            border-radius: 10px; 
            z-index: 110; 
            display: none; 
            box-shadow: 0 0 20px rgba(255, 199, 44, 0.5); 
            animation: slideIn 0.5s ease-out; 
        }

        .message-container { 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            background: #000; 
            display: none; 
            align-items: center; 
            justify-content: center; 
            padding: 20px; 
            box-sizing: border-box; 
            z-index: 60; 
        }

        .message-text { 
            color: var(--amarelo); 
            font-size: 5rem; 
            font-weight: 900; 
            text-align: center; 
            text-transform: uppercase; 
            line-height: 1.2; 
            text-shadow: 0 0 20px rgba(255,199,44,0.3); 
            max-width: 90%; 
            word-wrap: break-word; 
        }

        #sleep-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            z-index: 999;
            display: none;
            justify-content: center;
            align-items: center;
            color: #222;
            font-size: 2rem;
            font-weight: bold;
        }

        @keyframes slideIn { 
            from { transform: translateX(100%); } 
            to { transform: translateX(0); } 
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="top-section" id="painel-status">
            <div class="info-container">
                <div class="icon-cut"><i class="fas fa-cut"></i></div>
                <div class="text-group">
                    <div class="counter-number" id="active-cuts-count">0</div>
                    <div class="counter-label">Cortando Agora</div>
                </div>
            </div>
            <div class="ocioso-msg">CADEIRA LIVRE!<br>CORTE AGORA<br>SEM FILA</div>
        </div>

        <div class="bottom-section">
            <video id="player-video" loop muted autoplay playsinline></video>
            
            <div class="message-container" id="extra-msg-box">
                <div class="message-text" id="extra-msg-text"></div>
            </div>

            <div class="clock">
                <span class="status-dot" id="status-dot"></span>
                <span id="relogio">00:00</span>
            </div>
            
            <div id="ad-layer">
                <div class="tag-inteligente" id="smart-tag">🎯 OFERTA ESPECIAL</div>
                <img id="ad-image" class="ad-content" src="" alt="Propaganda Imagem">
                <video id="ad-video" class="ad-content" playsinline muted></video>
            </div>
        </div>

        <div id="sleep-screen">FORA DO HORÁRIO DE FUNCIONAMENTO</div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
                .then(() => console.log('Service Worker Registrado'))
                .catch(err => console.error('Erro no Service Worker:', err));
        }

        const countElement = document.getElementById('active-cuts-count');
        const painelStatus = document.getElementById('painel-status');
        const mainVideo = document.getElementById('player-video'); 
        const relogioDiv = document.getElementById('relogio');
        const statusDot = document.getElementById('status-dot');
        const sleepScreen = document.getElementById('sleep-screen');

        const TEMPO_OCIOSO_LIMIT = 10 * 60 * 1000;
        let modoAtual = '';
        let timerOcioso = null;
        let isOciosoAtivo = false;

        const videoTrabalho = "anuncio.mp4"; 
        const videoAlmoco = "almoco1.mp4"; 
        const CSV_URL = "https://docs.google.com/spreadsheets/d/1J_zE2x7lo62wlzClB2nGBNAxCDGpj2G9TKgWgLnSOyU/export?format=csv";

        // WATCHDOG (ANTI-TRAVAMENTO)
        let lastVideoTime = -1;
        let watchdogStuckCount = 0;

        function startWatchdog() {
            setInterval(() => {
                if (sleepScreen.style.display !== 'flex') {
                    if (mainVideo.currentTime === lastVideoTime && !mainVideo.paused) {
                        watchdogStuckCount++;
                        mainVideo.play().catch(() => {});
                        if (watchdogStuckCount >= 3) {
                            window.location.reload();
                        }
                    } else {
                        watchdogStuckCount = 0;
                        lastVideoTime = mainVideo.currentTime;
                    }
                }
            }, 10000);
        }

        // REGRAS DE HORÁRIO DETALHADAS E PRECISAS
        function verificarModoNoturno() {
            const agora = new Date();
            const diaSemana = agora.getDay(); // 0 = Domingo, 1 = Segunda ... 6 = Sábado
            const minutosAtuais = agora.getHours() * 60 + agora.getMinutes(); // Converte hora atual em minutos do dia

            let deveDesligar = false;

            if (diaSemana === 0) {
                // Domingo: Desligado o dia todo
                deveDesligar = true;
            } else if (diaSemana >= 1 && diaSemana <= 5) {
                // Segunda a Sexta: Ligar 08:30 (510 min) e Desligar 18:30 (1110 min)
                const inicioSegSexta = 8 * 60 + 30;  // 510 minutos
                const fimSegSexta = 18 * 60 + 30;    // 1110 minutos
                
                if (minutosAtuais < inicioSegSexta || minutosAtuais >= fimSegSexta) {
                    deveDesligar = true;
                }
            } else if (diaSemana === 6) {
                // Sábado: Ligar 08:30 (510 min) e Desligar 20:00 (1200 min)
                const inicioSabado = 8 * 60 + 30;   // 510 minutos
                const fimSabado = 20 * 60;          // 1200 minutos
                
                if (minutosAtuais < inicioSabado || minutosAtuais >= fimSabado) {
                    deveDesligar = true;
                }
            }

            // Aplica a tela preta e pausa o vídeo se for o caso
            if (deveDesligar) {
                if (sleepScreen.style.display !== 'flex') {
                    sleepScreen.style.display = 'flex';
                    mainVideo.pause();
                }
            } else {
                if (sleepScreen.style.display === 'flex') {
                    sleepScreen.style.display = 'none';
                    mainVideo.play().catch(() => {});
                }
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            verificarModoNoturno();
            atualizarPainel();
            atualizarRelogio();
            startWatchdog();
            
            setInterval(atualizarRelogio, 1000);
            setInterval(atualizarPainel, 5000);
            setInterval(verificarModoNoturno, 10000); // Valida horário a cada 10s
        });

        function atualizarRelogio() { 
            relogioDiv.innerText = new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'}); 
        }

        async function fetchGoogleSheetsData() {
            try {
                const cacheBuster = Math.floor(Date.now() / 5000);
                const response = await fetch(`${CSV_URL}&_cb=${cacheBuster}`, { cache: "no-store" });
                
                if (!response.ok) throw new Error("Erro na rede");
                
                const csvText = await response.text();
                if (!csvText) return null;

                const linhas = csvText.split('\n')
                    .map(l => l.trim())
                    .filter(l => l.replace(/[,;]/g, '').trim() !== ''); 
                
                if (linhas.length === 0) return null;

                const linhaDados = linhas[0];
                const separador = linhaDados.includes(';') ? ';' : ',';
                let valores = linhaDados.split(separador).map(v => v ? v.replace(/^"|"$/g, '').trim() : '');

                statusDot.classList.remove('offline');

                return {
                    modo: (valores[0] || 'trabalho').toLowerCase(),
                    qtd: parseInt(valores[1], 10) || 0
                };
            } catch (error) {
                statusDot.classList.add('offline');
                return null;
            }
        }

        async function atualizarPainel() {
            if (sleepScreen.style.display === 'flex') return; // Se a tela estiver desligada, ignora atualização visual

            const data = await fetchGoogleSheetsData();
            if (!data) return; 

            if (data.modo && data.modo !== modoAtual) {
                modoAtual = data.modo;
                const srcEsperado = (modoAtual === 'almoco' || modoAtual === 'fechado') ? videoAlmoco : videoTrabalho;
                
                if (mainVideo.getAttribute('src') !== srcEsperado) {
                    mainVideo.src = srcEsperado;
                    mainVideo.load();
                    mainVideo.play().catch(e => console.warn("Erro no autoplay:", e));
                }
                
                painelStatus.classList.toggle('escondido', (modoAtual === 'almoco' || modoAtual === 'fechado'));
            }

            const qtd = data.qtd || 0;
            countElement.innerText = qtd;

            if (qtd === 0) {
                if (!isOciosoAtivo && !timerOcioso) {
                    timerOcioso = setTimeout(() => { 
                        isOciosoAtivo = true; 
                        painelStatus.classList.add('ocioso'); 
                    }, TEMPO_OCIOSO_LIMIT);
                }
            } else {
                if (timerOcioso) {
                    clearTimeout(timerOcioso); 
                    timerOcioso = null;
                }
                isOciosoAtivo = false; 
                painelStatus.classList.remove('ocioso');
            }
        }
    </script>
</body>
</html>
